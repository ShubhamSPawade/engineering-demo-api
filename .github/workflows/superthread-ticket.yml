name: Superthread Ticket Policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
    branches: [dev, staging, main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  ticket:
    uses: ShubhamSPawade/engineering-platform/.github/workflows/reusable-superthread-ticket.yml@948f775cdc1b9c8db6aa10e6a0d495c16f75fc46
    with:
      policy-repository: ShubhamSPawade/engineering-platform
      policy-ref: 948f775cdc1b9c8db6aa10e6a0d495c16f75fc46
    secrets:
      SUPERTHREAD_API_TOKEN: ${{ secrets.SUPERTHREAD_API_TOKEN }}
