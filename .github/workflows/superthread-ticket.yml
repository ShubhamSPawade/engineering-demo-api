name: Superthread Ticket Policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
    branches: [dev, staging, main]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: superthread-ticket-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ticket:
    uses: ShubhamSPawade/engineering-platform/.github/workflows/reusable-superthread-ticket.yml@aea318db3ebbd300d8db5ea09efbcd57995d978c
    with:
      policy-repository: ShubhamSPawade/engineering-platform
      policy-ref: aea318db3ebbd300d8db5ea09efbcd57995d978c
    secrets:
      SUPERTHREAD_API_TOKEN: ${{ secrets.SUPERTHREAD_API_TOKEN }}
