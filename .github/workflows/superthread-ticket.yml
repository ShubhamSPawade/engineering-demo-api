name: Superthread Ticket Policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
    branches: [dev, staging, main]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: superthread-ticket-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ticket:
    uses: ShubhamSPawade/engineering-platform/.github/workflows/reusable-superthread-ticket.yml@9fb7234371a9107708b16e2a74645f8b5204abac
    with:
      policy-repository: ShubhamSPawade/engineering-platform
      policy-ref: 9fb7234371a9107708b16e2a74645f8b5204abac
    secrets:
      SUPERTHREAD_API_TOKEN: ${{ secrets.SUPERTHREAD_API_TOKEN }}
