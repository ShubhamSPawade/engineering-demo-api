name: Advisory AI Review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [dev, staging, main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: advisory-ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    uses: ShubhamSPawade/engineering-platform/.github/workflows/reusable-advisory-ai-review.yml@4f594a83fdf931809be0e607791648d834db6822
    with:
      policy-repository: ShubhamSPawade/engineering-platform
      policy-ref: 4f594a83fdf931809be0e607791648d834db6822
    secrets:
      PR_AGENT_GEMINI_KEY: ${{ secrets.PR_AGENT_GEMINI_KEY }}
