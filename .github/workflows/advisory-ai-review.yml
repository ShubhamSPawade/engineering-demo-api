name: Advisory AI Review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [dev, staging, main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: advisory-ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    uses: ShubhamSPawade/engineering-platform/.github/workflows/reusable-advisory-ai-review.yml@e5c9a2e159ff660d1abce4eda330af2f048212bf
    with:
      policy-repository: ShubhamSPawade/engineering-platform
      policy-ref: e5c9a2e159ff660d1abce4eda330af2f048212bf
    secrets:
      PR_AGENT_GEMINI_KEY: ${{ secrets.PR_AGENT_GEMINI_KEY }}
