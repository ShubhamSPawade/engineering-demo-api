name: Advisory AI Review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [dev, staging, main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: advisory-ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    uses: ShubhamSPawade/engineering-platform/.github/workflows/reusable-advisory-ai-review.yml@cafb9987974cdb0a64707de73f4f2eb2f46ed2a0
    with:
      policy-repository: ShubhamSPawade/engineering-platform
      policy-ref: cafb9987974cdb0a64707de73f4f2eb2f46ed2a0
    secrets:
      PR_AGENT_GEMINI_KEY: ${{ secrets.PR_AGENT_GEMINI_KEY }}
